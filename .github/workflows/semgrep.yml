name: semgrep

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep CE SAST scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv==0.11.24

      - name: Run Semgrep gate
        run: make semgrep