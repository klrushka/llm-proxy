name: gitleaks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'

      - name: Scan git history
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 git --redact --exit-code 1

      - name: Scan current files
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 dir --redact --exit-code 1